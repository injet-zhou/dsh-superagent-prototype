# Example profile configuration ($DSH_HOME/profiles/<profile>/cordis.patch.yml).
# Replace <placeholders> before first start; see docs/006-deployment.md.
- id: webserver
  config:
    host: 127.0.0.1
    port: 3082
- id: dsh-superagent
  config:
    stateDir: <absolute path, for example /home/me/.dsh/state/superagent>
    # Optional: additional repositories, each configured separately in the panel's repository selector.
    # repositories:
    #   - id: backend
    #     name: Backend
    #   - id: frontend
    #     name: Frontend
# Feishu is optional: uncomment to enable its Source, then set the bot's lark-cli on the Feishu Source.
# - id: dsh-superagent-feishu
#   disabled: false
# Discord is optional: create a private bot token file, then configure channel/thread IDs on the Source.
# - id: dsh-superagent-discord
#   disabled: false
